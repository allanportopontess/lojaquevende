<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Páginas do livro animado (700x1040). Uso: paginas.html?p=1|2|3|4 -->
<style>
@font-face{font-family:M;src:url(../isca/fonts/metropolis-latin-400-normal.woff2)}
@font-face{font-family:M;src:url(../isca/fonts/metropolis-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:M;src:url(../isca/fonts/metropolis-latin-700-normal.woff2);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:700px;height:1040px;overflow:hidden}
body{font-family:M,sans-serif;background:#f4efe6;color:#1d1d1d;position:relative}
body::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.10),rgba(0,0,0,0) 7%),repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 1px,transparent 1px 4px)}
.folha{position:absolute;inset:34px 30px 30px 46px;border:1.5px solid #1d1d1d;display:flex;flex-direction:column}
.topo{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1.5px solid #1d1d1d}
.topo small{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#6b6b6b}
.topo b{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#E08A00}
h1{font-size:34px;letter-spacing:-1px;padding:18px 18px 4px}
.sub{padding:0 18px;color:#555;font-size:14px}
.area{flex:1;position:relative;margin:14px 18px}
.area svg{width:100%;height:100%}
.area img{width:100%;height:100%;object-fit:cover;border:1.5px solid #1d1d1d}
.carimbo{display:grid;grid-template-columns:1.4fr 1fr 1fr;border-top:1.5px solid #1d1d1d;font-size:11px}
.carimbo div{padding:10px 14px;border-right:1.5px solid #1d1d1d}
.carimbo div:last-child{border-right:0}
.carimbo small{display:block;color:#777;letter-spacing:2px;font-size:9px;text-transform:uppercase;margin-bottom:3px}
.carimbo b{font-size:12px}
.leg{display:flex;gap:16px;flex-wrap:wrap;padding:0 18px 12px;font-size:12px;color:#444}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:14px;height:14px;display:inline-block}
text{font-family:M,sans-serif}

body.mist .area,body.mist .leg,body.mist .sub{filter:blur(9px);opacity:.75}
body.mist .carimbo{filter:blur(3px)}
.cadeado{display:none}
body.mist .cadeado{display:flex;position:absolute;left:0;right:0;top:40%;flex-direction:column;align-items:center;gap:16px;z-index:5;text-align:center}
.cadeado .c{width:120px;height:120px;border-radius:50%;background:#0D0D0D;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(224,138,0,.18),0 20px 50px -10px rgba(0,0,0,.5)}
.cadeado .c svg{width:52px;height:52px;fill:none;stroke:#FF9F01;stroke-width:1.8;stroke-linecap:round}
.cadeado b{font-size:24px;letter-spacing:-.5px;color:#1d1d1d;background:rgba(244,239,230,.85);padding:6px 14px;border-radius:6px}
.cadeado small{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#E08A00;font-weight:700;background:rgba(244,239,230,.85);padding:4px 10px;border-radius:4px}
</style>
</head>
<body>
<div class="folha" id="f"></div>
<script>
var p = new URLSearchParams(location.search).get('p') || '1';
var IMG = '../site/img/';
var cab = function (n, tag, t, s) {
  return '<div class="topo"><small>Análise de projeto · ' + n + '</small><b>' + tag + '</b></div><h1>' + t + '</h1><p class="sub">' + s + '</p>';
};
var carimbo = function (esc) {
  return '<div class="carimbo"><div><small>Projeto</small><b>Loja de moda fitness · 19,52 m²</b></div><div><small>Escala</small><b>' + esc + '</b></div><div><small>Autor</small><b>Allan Porto · CAU</b></div></div>';
};
// planta base (unidades em cm; 520 x 375)
var planta = function (extra) {
  return '<svg viewBox="-40 -40 600 460">' +
  '<defs><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1d1d1d" stroke-width="1.6"/></pattern></defs>' +
  // paredes
  '<path d="M0 0 H520 V375 H400 M300 375 H0 Z" fill="none" stroke="#1d1d1d" stroke-width="14"/>' +
  '<rect x="-7" y="-7" width="534" height="14" fill="url(#h)"/>' +
  // porta de giro
  '<path d="M300 375 A100 100 0 0 1 400 275" fill="none" stroke="#1d1d1d" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="300" y1="375" x2="300" y2="275" stroke="#1d1d1d" stroke-width="2"/>' +
  // vitrine
  '<rect x="150" y="330" width="130" height="36" fill="#fff" stroke="#1d1d1d" stroke-width="2"/><text x="215" y="353" text-anchor="middle" font-size="13">VITRINE</text>' +
  // caixa
  '<rect x="440" y="40" width="62" height="130" fill="#fff" stroke="#1d1d1d" stroke-width="2"/><text x="471" y="112" text-anchor="middle" font-size="13" transform="rotate(-90 471 108)">CAIXA</text>' +
  // mesa central + puffs
  '<circle cx="270" cy="190" r="38" fill="#fff" stroke="#1d1d1d" stroke-width="2"/><text x="270" y="195" text-anchor="middle" font-size="12">MESA</text><circle cx="215" cy="190" r="12" fill="none" stroke="#1d1d1d" stroke-width="1.5"/><circle cx="325" cy="190" r="12" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>' +
  // araras
  '<rect x="18" y="18" width="190" height="26" fill="#fff" stroke="#1d1d1d" stroke-width="2"/><rect x="18" y="18" width="26" height="200" fill="#fff" stroke="#1d1d1d" stroke-width="2"/><text x="120" y="36" text-anchor="middle" font-size="12">ARARAS</text>' +
  // provador
  '<rect x="420" y="250" width="90" height="90" fill="none" stroke="#1d1d1d" stroke-width="2"/><text x="465" y="300" text-anchor="middle" font-size="12">PROVADOR</text>' +
  (extra || '') +
  // cotas
  '<g stroke="#E08A00" stroke-width="1.2" fill="#E08A00" font-size="13"><line x1="0" y1="-26" x2="520" y2="-26"/><line x1="0" y1="-32" x2="0" y2="-20"/><line x1="520" y1="-32" x2="520" y2="-20"/><text x="260" y="-31" text-anchor="middle" stroke="none">5,20</text>' +
  '<line x1="-26" y1="0" x2="-26" y2="375"/><line x1="-32" y1="0" x2="-20" y2="0"/><line x1="-32" y1="375" x2="-20" y2="375"/><text x="-31" y="190" text-anchor="middle" stroke="none" transform="rotate(-90 -31 190)">3,75</text></g>' +
  '</svg>';
};
var H = '';
if (p === '1') {
  H = cab('01', 'Planta baixa', 'Planta baixa humanizada', 'Layout, circulação e posição de cada mobiliário.') +
    '<div class="area">' + planta('<text x="360" y="100" font-size="12" fill="#777">A = 19,52 m²</text>') + '</div>' +
    '<div class="leg"><span><i style="border:2px solid #1d1d1d"></i>Mobiliário</span><span><i style="background:url(#h);border:2px solid #1d1d1d;background:repeating-linear-gradient(45deg,#1d1d1d 0 2px,transparent 2px 5px)"></i>Parede</span><span><i style="border-top:2px solid #E08A00;height:0;margin-top:7px"></i>Cotas (m)</span></div>' + carimbo('1:50');
} else if (p === '2') {
  H = cab('02', 'Perspectiva 3D', 'Perspectiva 3D', 'Ripado amadeirado, piso claro e mobiliário branco ampliam o espaço.') +
    '<div class="area"><img src="' + IMG + 'caso-pausa.jpg"></div>' +
    '<div class="leg"><span><i style="background:#8a6a4a"></i>Ripado</span><span><i style="background:#e9e6e0;border:1px solid #999"></i>Piso claro</span><span><i style="background:#1d1d1d"></i>Serralheria preta</span></div>' + carimbo('S/E');
} else if (p === '3') {
  var spots = [[120,80],[200,80],[280,80],[360,80],[230,150],[310,150],[215,300],[250,300],[465,290]].map(function (s) {
    return '<circle cx="' + s[0] + '" cy="' + s[1] + '" r="46" fill="url(#luz)"/><circle cx="' + s[0] + '" cy="' + s[1] + '" r="8" fill="#fff" stroke="#1d1d1d" stroke-width="1.5"/><path d="M' + (s[0]-6) + ' ' + (s[1]-6) + 'l12 12M' + (s[0]+6) + ' ' + (s[1]-6) + 'l-12 12" stroke="#1d1d1d" stroke-width="1.3"/>';
  }).join('');
  H = cab('03', 'Luminotécnico', 'Iluminação em camadas', 'Destaque na vitrine e no produto-foco, tarefa no caixa, luz quente no provador.') +
    '<div class="area">' + planta('<defs><radialGradient id="luz"><stop offset="0" stop-color="#FFB733" stop-opacity=".7"/><stop offset="1" stop-color="#FFB733" stop-opacity="0"/></radialGradient></defs>' +
      '<line x1="100" y1="80" x2="380" y2="80" stroke="#E08A00" stroke-width="3"/><line x1="210" y1="150" x2="330" y2="150" stroke="#E08A00" stroke-width="3"/>' + spots +
      '<line x1="446" y1="50" x2="446" y2="160" stroke="#FF9F01" stroke-width="5" stroke-dasharray="2 3"/>') + '</div>' +
    '<div class="leg"><span><i style="border-radius:50%;border:2px solid #1d1d1d"></i>Spot PAR20</span><span><i style="border-top:3px solid #E08A00;height:0;margin-top:6px"></i>Trilho eletrificado</span><span><i style="border-top:3px dotted #FF9F01;height:0;margin-top:6px"></i>Fita LED no caixa</span></div>' + carimbo('1:50');
} else {
  var n = [['Calçada', 'olhar de fora', 350, 40], ['Vitrine', '1 produto-foco', 350, 150], ['Entrada', 'vira à direita', 350, 260], ['Zona quente', 'maior margem', 350, 370],
           ['Ponto de pausa', 'mesa + puffs', 130, 370], ['Araras', 'exploração', 130, 480], ['Provador', 'decisão', 350, 480], ['Caixa', 'impulso', 350, 590]];
  var box = n.map(function (b, i) {
    var hot = i === 3 || i === 4;
    return '<g><rect x="' + (b[2]-95) + '" y="' + b[3] + '" width="190" height="72" rx="10" fill="' + (hot ? '#1d1d1d' : '#fff') + '" stroke="#1d1d1d" stroke-width="2"/>' +
      '<text x="' + b[2] + '" y="' + (b[3]+32) + '" text-anchor="middle" font-size="19" font-weight="700" fill="' + (hot ? '#FF9F01' : '#1d1d1d') + '">' + b[0] + '</text>' +
      '<text x="' + b[2] + '" y="' + (b[3]+54) + '" text-anchor="middle" font-size="13" fill="' + (hot ? '#ddd' : '#666') + '">' + b[1] + '</text></g>';
  }).join('');
  var seta = function (d) { return '<path d="' + d + '" fill="none" stroke="#E08A00" stroke-width="3" marker-end="url(#m)"/>'; };
  H = cab('04', 'Fluxograma', 'Fluxo do cliente', 'O percurso desenhado de propósito, da calçada até o caixa.') +
    '<div class="area"><svg viewBox="0 0 520 680"><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E08A00"/></marker></defs>' +
    seta('M350 112 V146') + seta('M350 222 V256') + seta('M350 332 V366') + seta('M255 406 H229') + seta('M130 442 V476') + seta('M225 516 H251') + seta('M350 552 V586') + box + '</svg></div>' + carimbo('—');
}
document.getElementById('f').innerHTML = H;
if (new URLSearchParams(location.search).get('m')) {
  document.body.classList.add('mist');
  var temas = {1:'Planta baixa estratégica',2:'Perspectiva 3D',3:'Projeto luminotécnico',4:'Fluxo do cliente'};
  var d = document.createElement('div'); d.className = 'cadeado';
  d.innerHTML = '<span class="c"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg></span><b>' + temas[p] + '</b><small>Liberado dentro do curso</small>';
  document.body.appendChild(d);
}
</script>
</body>
</html>
